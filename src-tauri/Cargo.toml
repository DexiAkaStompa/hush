[package]
name = "hush-desktop"
version = "0.5.70"
description = "Hush Rust desktop runtime — isolated parity preview"
edition = "2021"
rust-version = "1.100"
publish = false

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["sync", "time", "net", "io-util", "fs", "macros"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
opt-level = "s"
panic = "abort"

[target."cfg(windows)".dependencies]
base64 = "0.22"
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes"] }
