name: Verify Hush Rust preview

on:
  push:
    branches: [codex/rust-desktop]
  pull_request:
    paths:
      - src-tauri/**
      - src/**
      - scripts/verify-rust.mjs
      - scripts/build-rust-update*.mjs
      - package*.json
      - .github/workflows/rust-preview.yml
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish the signed Windows Rust channel after the Electron bridge release exists
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      publish_preview:
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: rust-preview-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Rust parity preview
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_MUSIC_BRIDGE_URL: ${{ secrets.VITE_MUSIC_BRIDGE_URL }}
      VITE_SHARED_MEDIA_URL: ${{ vars.VITE_SHARED_MEDIA_URL }}
      VITE_TURN_URL: ${{ vars.VITE_TURN_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install client dependencies
        run: npm ci
      - name: Test shared application and desktop adapter
        run: |
          npm test
          node --test scripts/build-rust-update.node.mjs
      - name: Build shared interface and icons
        run: |
          npm run icons:build
          npm run build
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Test Rust native operations
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Lint Rust native operations
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Build packaged debug runtime for verification
        run: cargo build --manifest-path src-tauri/Cargo.toml --features custom-protocol --locked
      - name: Start and verify real WebView2 app
        run: node scripts/verify-rust.mjs
      - name: Build isolated preview installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --ci -- --locked
      - name: Prepare signed update channel manifest
        run: node scripts/build-rust-update.mjs
      - name: Verify the real installer signature and signed version
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw "Expected one signed installer" }
          $env:HUSH_RUST_VERIFY_PACKAGE = $installers[0].FullName
          cargo test --manifest-path src-tauri/Cargo.toml --locked signed_installer_rejects_corruption_and_a_substituted_version -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $verifyBridge = @'
          const { createHash } = require('node:crypto');
          const { readFileSync } = require('node:fs');
          const { dirname, join } = require('node:path');
          const { selectPackage, verifyInstaller } = require('./electron/rust-upgrade.cjs');
          const filename = process.env.HUSH_RUST_VERIFY_PACKAGE;
          const manifest = JSON.parse(readFileSync(join(dirname(filename), 'rust-latest.json'), 'utf8'));
          const selected = selectPackage(manifest, require('./package.json').version);
          verifyInstaller(createHash('blake2b512').update(readFileSync(filename)).digest(), selected, readFileSync('src-tauri/updater.pub', 'utf8'));
          '@
          node -e $verifyBridge
      - name: Verify a first installation creates a shortcut and opens Rust
        shell: pwsh
        run: |
          $installer = (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName
          $setup = Start-Process -FilePath $installer -ArgumentList '/P','/R','/ARGS' -WindowStyle Hidden -PassThru
          if (!$setup.WaitForExit(90000) -or $setup.ExitCode -ne 0) { throw 'The passive Rust installer did not complete' }
          $programs = [Environment]::GetFolderPath('Programs')
          $name = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).productName
          if (!(Test-Path -LiteralPath (Join-Path $programs "$name.lnk"))) { throw 'The Rust installer did not create a Start Menu shortcut' }
          $deadline = (Get-Date).AddSeconds(20)
          do {
            $client = Get-Process -Name 'hush-desktop' -ErrorAction SilentlyContinue
            if (!$client) { Start-Sleep -Milliseconds 500 }
          } until ($client -or (Get-Date) -ge $deadline)
          if (!$client) { throw 'The Rust installer did not open the new client' }
          $client | Stop-Process
      - name: Upload preview installer
        uses: actions/upload-artifact@v4
        with:
          name: hush-rust-windows-preview
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/rust-latest.json
          if-no-files-found: error
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hush-rust-verification
          path: release-rust-check/
          if-no-files-found: ignore

  publish:
    name: Publish isolated signed Rust channel
    if: inputs.publish_preview
    needs: windows
    runs-on: ubuntu-latest
    concurrency:
      group: signed-windows-rust-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: hush-rust-windows-preview
          path: rust-artifacts
      - name: Require the matching Electron migration bridge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          test "$(gh release view --json tagName --jq .tagName)" = "v$version"
          gh release view "v$version" --json isDraft,assets > bridge.json
          node --input-type=module -e 'import fs from "node:fs"; const release=JSON.parse(fs.readFileSync("bridge.json")); const version=JSON.parse(fs.readFileSync("package.json")).version; if(release.isDraft || !release.assets.some(asset => asset.name === `Hush-Setup-${version}.exe`)) throw new Error("Publish the Electron migration bridge first");'
      - name: Publish signed installer and channel manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view rust-preview >/dev/null 2>&1; then
            gh release create rust-preview --target "$(git rev-parse HEAD)" --title "Hush Rust for Windows" --prerelease --latest=false --notes-file docs/RUST_RELEASE_NOTES.md
          else
            gh release edit rust-preview --title "Hush Rust for Windows" --prerelease --latest=false --notes-file docs/RUST_RELEASE_NOTES.md
          fi
          gh release upload rust-preview rust-artifacts/*.exe rust-artifacts/*.sig --clobber
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { setTimeout } from 'node:timers/promises';
          const manifest = JSON.parse(fs.readFileSync('rust-artifacts/rust-latest.json', 'utf8'));
          const url = manifest.platforms['windows-x86_64'].url;
          let reachable = false;
          for (let attempt = 0; attempt < 6; attempt++) {
            const response = await fetch(url, { method: 'HEAD', signal: AbortSignal.timeout(15000) });
            if (response.ok && Number(response.headers.get('content-length')) > 0) { reachable = true; break; }
            await setTimeout(5000);
          }
          if (!reachable) throw new Error('The published installer URL is unavailable; update manifest not published');
          NODE
          gh release upload rust-preview rust-artifacts/rust-latest.json --clobber
